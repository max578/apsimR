# Standard R CMD check matrix (r-lib/actions check-standard): three operating
# systems and three R versions. Runs on pushes and pull requests to main only,
# so feature-branch work stays local and the minutes budget is bounded.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
        # macOS (10x) and Windows (2x) runners are billed at multiples on a private
        # repository and exhausted the account's monthly minutes on 2026-08-25;
        # Linux-only until the repository is public or a release tag re-enables them.
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # optimix is a private sibling used only as an optional test oracle
      # (every use sits behind skip_if_not_installed). No runner can fetch it,
      # so the resolver is told to ignore it rather than fail on it.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            optimix=?ignore
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          # optimix is a private sibling: unfetchable on a public runner, so an
          # absent Suggests package must be a NOTE, not an error; PESTO comes
          # from its public GitHub repository (Remotes in DESCRIPTION)
          _R_CHECK_FORCE_SUGGESTS_: false
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
